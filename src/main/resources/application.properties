
# =========================
# APP CONFIGURATION
# =========================
spring.application.name=${SPRING_APPLICATION_NAME:shardaos}
server.port=${SERVER_PORT:8080}

# Load .env file
spring.config.import=optional:file:.env[.properties]

# =========================
# DATABASE CONFIG (MySQL)
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# =========================
# MAIL CONFIG (BREVO SMTP)
# =========================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}

# =========================
# FIREBASE CONFIG
# =========================
firebase.config.path=${FIREBASE_CONFIG_PATH}

# =========================
# JWT CONFIG
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# CLOUDFLARE CONFIG
# =========================
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}

# =========================
# CORS CONFIG
# =========================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.web.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# =========================
# GEMINI AI
# =========================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}

# =========================
# EXTERNAL PORTAL API KEYS
# =========================
app.external.consultant.apikey=${CONSULTANT_API_KEY}
app.external.client.apikey=${CLIENT_API_KEY}
app.external.project.apikey=${PROJECT_API_KEY}
